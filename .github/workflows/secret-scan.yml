# Scans for committed secrets: the commits of every push and pull request, and the full history
# once a week and on demand, as gitleaks-action does for schedule and workflow_dispatch events.
# Actions are pinned to commit SHAs; Dependabot proposes updates.
name: secret-scan

on:
  push:
  pull_request:
  schedule:
    # Mondays at 06:17 UTC; off the hour, when fewer scheduled runs queue.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
