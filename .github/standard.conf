# .github/standard.conf of local-ai-launcher: data for .github/standard/bin/conf, which alone
# reads it (the repository standard, section 2.4).
NAME=local-ai-launcher
VISIBILITY=public
# lint and test run ci/lint.ps1 and ci/test.ps1 on Windows, where the launcher runs.
CI_RUNNER=windows
CI_STAGES=lint test
PYTHON=3.13
PS_MODULES=pester psscriptanalyzer
# The standard's release.yml builds on Windows, where ci/release-build.ps1 runs the launcher's own
# zip build, and attests and drafts the zip, its install.ps1 and SHA256SUMS.
RELEASE_KIND=zip
RELEASE_RUNNER=windows
RELEASE_MANIFEST=local-ai-release.json
RELEASE_ASSETS=src/install.ps1
PRIVACY_RULES=base
# Made-up Windows homes of the Pester tests (users User and Test).
PRIVACY_ALLOW=home-path ^tests/LocalAI(\.[A-Za-z]+)*\.ps1$ ^c:[\\/]+users[\\/]+(user|test)$
# The folder suffixes .local-ai-clone, .local-ai-old-venv and .local-ai-removing, which the
# host-name rule reads as names under .local. Goes once repo-standard fixes that rule.
PRIVACY_ALLOW=host-name ^(src/LocalAI\.psm1|tests/LocalAI(\.[A-Za-z]+)*\.ps1)$ ^([a-z0-9-]+\.)*(dir|comfyui|folder)\.local$
# The link-local test address of Test-LocalHostName, also in the older versions of that file.
PRIVACY_ALLOW=ipv6-private ^tests/LocalAI(\.[A-Za-z]+)*\.ps1$ ^fe80::1$
# GitHub's support address in the sign-off line of every Dependabot commit. Goes once
# repo-standard fixes the e-mail rule.
PRIVACY_ALLOW=e-mail ^ ^support@github\.com$
# The GitHub runner's own short home path in a comment of two old versions of ci.yml.
PRIVACY_HISTORY_ACCEPT=43b95ee50acbab55a772d2b7269f615254189a01 home-path
PRIVACY_HISTORY_ACCEPT=e166d794691df86a465092351cb2aa518e13e5a4 home-path
